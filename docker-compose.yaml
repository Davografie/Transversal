services:
  arangodb:
    build: ./arangodb
    image: tv_adb
    container_name: tv_adb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    volumes:
      - "tv_data:/var/lib/arangodb3"
      - "./arangodb/init_data:/init_data"
    networks:
      - network_tv
    ports:
      - 8529:8529
  redis:
    image: redis
    container_name: tv_redis
    ports:
      - 6379:6379
    networks:
      - network_tv
  imagen:
    build: ./imagen
    image: tv_imagen
    container_name: tv_imagen
    volumes:
      - ${MEDIA_FOLDER}/imagens:/media/imagens
      - ${T2I_MODEL_FOLDER}:/app/ComfyUI/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    networks:
      - network_tv
    ports:
      - 8188:8188
    # expose:
    #   - 8188
  flask:
    build: ./flask
    image: tv_flask
    container_name: tv_flask
    logging:
      options:
        max-size: "32KiB"
        max-file: "3"
    volumes:
      - "./flask:/app/:ro"
      - ${MEDIA_FOLDER}/uploads:/media/uploads
      - ${MEDIA_FOLDER}/imagens:/media/imagens
      - ${T2I_MODEL_FOLDER}:/media/ComfyUI/models
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
      MEDIA_FOLDER: ${MEDIA_FOLDER}
    networks:
      - network_tv
    ports:
      - 5000:5000
    expose:
      - 5000
    entrypoint: python
    command: app.py
  fastapi:
    build: ./fastapi
    image: tv_fastapi
    container_name: tv_fastapi
    volumes:
      - "./fastapi:/app/:ro"
    networks:
      - network_tv
    ports:
      - 8000:8000
    expose:
      - 8000
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  vue:
    build: ./vue
    image: tv_vue
    container_name: tv_vue
    volumes:
      - "./vue:/usr/src/app"
      - "/usr/src/app/node_modules"
      - ${MEDIA_FOLDER}/uploads:/usr/src/app/public/assets/uploads
    environment:
      VITE_PUBLIC_IP: ${PUBLIC_IP}
    networks:
      - network_tv
    ports:
      - 8080:8080
    expose:
      - 8080
